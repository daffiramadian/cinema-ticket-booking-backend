services:
  postgres:
    image: postgres:17-alpine
    container_name: cinema-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cinema}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_dev_only}
      POSTGRES_MULTIPLE_DATABASES: catalog_db,booking_db,payment_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/01-init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cinema}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

