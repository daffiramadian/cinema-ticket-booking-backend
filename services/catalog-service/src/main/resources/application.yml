server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD:cinema_dev_only}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: API v1
        url: /openapi-v1.yaml
      - name: API v2
        url: /openapi-v2.yaml
    urls-primary-name: API v1

